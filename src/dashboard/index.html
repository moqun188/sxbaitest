<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 听写学习看板 - sxbaitest</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #334155;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --accent3: #f472b6;
    --accent4: #34d399;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --danger: #fb7185;
    --success: #4ade80;
    --warning: #fbbf24;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .header p { color: var(--text-dim); font-size: 0.9rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .card-title {
    font-size: 0.85rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .stat-value {
    font-size: 2.8rem;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-sub {
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .chart-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 768px) {
    .chart-row { grid-template-columns: 1fr; }
  }
  .chart-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .chart-card h3 {
    font-size: 1rem;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .error-table {
    width: 100%;
    border-collapse: collapse;
  }
  .error-table th {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim);
    font-size: 0.8rem;
    text-transform: uppercase;
  }
  .error-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 0.95rem;
  }
  .error-table tr:hover { background: var(--card-hover); }
  .rank { color: var(--accent); font-weight: 700; }
  .bar-bg {
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.6s ease;
  }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge-up { background: rgba(74,222,128,0.15); color: var(--success); }
  .badge-down { background: rgba(251,113,133,0.15); color: var(--danger); }
  .badge-stable { background: rgba(251,191,36,0.15); color: var(--warning); }
  .footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .loading {
    text-align: center;
    padding: 60px;
    color: var(--text-dim);
    font-size: 1.2rem;
  }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📚 听写词语学习看板</h1>
  <p id="timestamp">加载中...</p>
</div>

<div id="app" class="loading pulse">📊 正在加载数据...</div>

<script>
const API = '';

async function load() {
  try {
    const [report, errorsTop, sessions] = await Promise.all([
      fetch(`${API}/api/report`).then(r => r.json()),
      fetch(`${API}/api/errors/top?limit=10`).then(r => r.json()),
      fetch(`${API}/api/sessions`).then(r => r.json())
    ]);

    document.getElementById('timestamp').textContent =
      `数据更新于 ${new Date(report.generatedAt).toLocaleString('zh-CN')}`;

    render(report, errorsTop, sessions);
  } catch (err) {
    document.getElementById('app').innerHTML =
      `<div style="color:var(--danger)">❌ 加载失败: ${err.message}</div>`;
  }
}

function render(report, errorsTop, sessions) {
  const { vocabulary, errors, accuracy } = report;
  const trendBadge = accuracy.trend.includes('上升') ? 'badge-up' :
                     accuracy.trend.includes('下降') ? 'badge-down' : 'badge-stable';

  let html = '';

  // ===== 顶部统计卡片 =====
  html += '<div class="grid">';
  html += statCard('📚', '词库总量', vocabulary.total, '个词语', 'var(--accent)');
  html += statCard('❌', '错词总数', errors.uniqueWords, `共 ${errors.totalErrors} 次错误`, 'var(--danger)');
  html += statCard('📈', '正确率', accuracy.current + '%', `平均 ${accuracy.average}%`, 'var(--success)');
  html += statCard('📊', '学习趋势', accuracy.trend, '', 'var(--warning)', trendBadge);
  html += '</div>';

  // ===== 图表区域 =====
  html += '<div class="chart-row">';

  // 课程分布饼图
  html += `<div class="chart-card">
    <h3>📖 课程词语分布</h3>
    <canvas id="lessonChart" height="260"></canvas>
  </div>`;

  // 错词TOP柱状图
  html += `<div class="chart-card">
    <h3>🔥 高频错词 TOP${Math.min(errorsTop.length, 10)}</h3>
    <canvas id="errorChart" height="260"></canvas>
  </div>`;

  html += '</div>';

  // ===== 错词明细表 =====
  if (errorsTop.length > 0) {
    html += '<div class="chart-card" style="margin-bottom:24px">';
    html += '<h3>📝 错词明细</h3>';
    html += '<table class="error-table"><thead><tr>';
    html += '<th>排名</th><th>词语</th><th>错误次数</th><th>占比</th>';
    html += '</tr></thead><tbody>';

    const maxCount = errorsTop[0].count;
    errorsTop.forEach((w, i) => {
      const pct = Math.round((w.count / errors.totalErrors) * 100);
      const barColor = i < 3 ? 'var(--danger)' : 'var(--accent)';
      html += `<tr>
        <td class="rank">#${i + 1}</td>
        <td style="font-size:1.1rem;font-weight:600">${w.word}</td>
        <td>${w.count} 次</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="bar-bg" style="flex:1">
              <div class="bar-fill" style="width:${(w.count/maxCount)*100}%;background:${barColor}"></div>
            </div>
            <span style="color:var(--text-dim);font-size:0.8rem">${pct}%</span>
          </div>
        </td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }

  // ===== 课程详情 =====
  if (vocabulary.byLesson.length > 0) {
    html += '<div class="chart-card" style="margin-bottom:24px">';
    html += '<h3>📖 课程详情</h3>';
    html += '<table class="error-table"><thead><tr>';
    html += '<th>课程</th><th>词语数</th><th>占比</th>';
    html += '</tr></thead><tbody>';

    const maxLesson = Math.max(...vocabulary.byLesson.map(l => l.count));
    vocabulary.byLesson.forEach(l => {
      const pct = Math.round((l.count / vocabulary.total) * 100);
      html += `<tr>
        <td style="font-weight:600">${l.lesson}</td>
        <td>${l.count} 个</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="bar-bg" style="flex:1">
              <div class="bar-fill" style="width:${(l.count/maxLesson)*100}%;background:var(--accent2)"></div>
            </div>
            <span style="color:var(--text-dim);font-size:0.8rem">${pct}%</span>
          </div>
        </td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }

  // 页脚
  html += '<div class="footer">sxbaitest 听写词语学习系统 v2.0 · 陈总(B) 开发</div>';

  document.getElementById('app').innerHTML = html;

  // 渲染图表
  renderLessonChart(vocabulary.byLesson);
  renderErrorChart(errorsTop);
}

function statCard(icon, label, value, sub, color, badgeClass) {
  const valueHtml = badgeClass
    ? `<span class="badge ${badgeClass}">${value}</span>`
    : `<div class="stat-value" style="color:${color}">${value}</div>`;
  return `<div class="card">
    <div class="card-title">${icon} ${label}</div>
    ${valueHtml}
    ${sub ? `<div class="stat-sub" style="margin-top:8px">${sub}</div>` : ''}
  </div>`;
}

function renderLessonChart(byLesson) {
  const canvas = document.getElementById('lessonChart');
  if (!canvas || byLesson.length === 0) return;

  const colors = ['#38bdf8', '#818cf8', '#f472b6', '#34d399', '#fbbf24',
                  '#fb923c', '#a78bfa', '#22d3ee', '#f87171', '#4ade80'];

  new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: byLesson.map(l => l.lesson),
      datasets: [{
        data: byLesson.map(l => l.count),
        backgroundColor: colors.slice(0, byLesson.length),
        borderWidth: 0,
        hoverOffset: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#94a3b8', padding: 16, font: { size: 13 } }
        }
      }
    }
  });
}

function renderErrorChart(errorsTop) {
  const canvas = document.getElementById('errorChart');
  if (!canvas || errorsTop.length === 0) return;

  const colors = errorsTop.map((_, i) =>
    i < 3 ? '#fb7185' : i < 6 ? '#fbbf24' : '#38bdf8'
  );

  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: errorsTop.map(w => w.word),
      datasets: [{
        label: '错误次数',
        data: errorsTop.map(w => w.count),
        backgroundColor: colors,
        borderRadius: 8,
        borderSkipped: false,
        barThickness: 28
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#94a3b8', stepSize: 1 }
        },
        y: {
          grid: { display: false },
          ticks: { color: '#f1f5f9', font: { size: 14, weight: '600' } }
        }
      }
    }
  });
}

load();
// 每30秒自动刷新
setInterval(load, 30000);
</script>
</body>
</html>
